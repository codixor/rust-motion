name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Formatting & Clippy Lints ─────────────────────────────────────
  fmt_clippy:
    name: Code Quality (Fmt & Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --locked --workspace --all-targets --all-features

  # ── 2. Cross-Platform Unit & Integration Tests ──────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: fmt_clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The general matrix deliberately does not install FFmpeg: every test
      # that needs it skips loudly, so macOS/Windows stay green without the
      # slow brew/choco installs. The h264_encoder_gate job installs FFmpeg and
      # runs the real encoder plus the FFmpeg-dependent integration suites.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cargo Check Workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run All Workspace Tests
        run: cargo test --locked --workspace --exclude rust-motion-python

      - name: Test GPU scene compilation without device initialization
        run: 'cargo test --locked -p rust-motion-rasterizer --features gpu support_tests::'

  # ── 3. TypeScript SDK and Remotion Bridge tests ───────────────────────────
  typescript_sdk:
    name: TypeScript SDK & Remotion Bridge
    runs-on: ubuntu-latest
    needs: [fmt_clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run TypeScript Tests
        run: |
          node --test crates/ts/tests/*.test.mjs

      - name: Verify npm package distribution
        run: |
          cd crates/ts
          npm pack --dry-run

  # ── 4. WebAssembly Engine & Browser Canvas ────────────────────────────────
  wasm:
    name: WebAssembly (WASM Engine & Browser Canvas)
    runs-on: ubuntu-latest
    needs: [fmt_clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check WASM target
        run: cargo check --locked -p rust-motion-wasm --target wasm32-unknown-unknown

      - name: Run WASM crate native unit tests
        run: cargo test --locked -p rust-motion-wasm
  # ── 5. Standalone H.264 encoder quality and robustness gate ─────────────
  # Uses rust-motion-h264enc directly (no renderer crate): CRF 20 PSNR >= 38 dB
  # on a generated RGBA fixture, then odd-size encodes must never panic.
  h264_encoder_gate:
    name: H.264 Encoder Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg and system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libssl-dev

      - name: Build h264enc gate
        run: cargo build --locked -p rust-motion-h264enc --tests

      - name: CRF 20 PSNR gate and odd-size panic fuzz
        run: cargo test --locked -p rust-motion-h264enc --test encoder_gate -- --nocapture

      # Keep end-to-end render coverage in the one job that has a real FFmpeg.
      - name: FFmpeg-dependent integration tests
        run: |
          set -euo pipefail
          cargo test --locked -p rust-motion-cli --test e2e_cli_subprocess
          cargo test --locked -p rust-motion-cli --test tier3_subsystem_integration
          cargo test --locked -p rust-motion-cli --test tier4_acceptance_scenario
          cargo test --locked -p rust-motion-rasterizer --lib render::tests::
          cargo test --locked -p rust-motion-rasterizer --test lottie_and_emoji_tests
